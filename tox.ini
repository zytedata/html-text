[tox]
envlist = py311,py312,py313,py314,py315,py311-parsel,min,twinecheck

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    py311-parsel: parsel
commands =
    pytest --cov=html_text --cov-report=xml --cov-report=term-missing {env:PYTEST_DOC:} {posargs:.}

[testenv:min]
basepython = python3.11
deps =
    {[testenv]deps}
    lxml==4.9.1
    lxml-html-clean==0.1.0

[testenv:py311-parsel]
setenv =
    PYTEST_DOC = --doctest-modules --doctest-glob='*.rst'

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:typing]
basepython = python3
deps =
    mypy==2.3.0
    parsel==1.11.0
    pytest==9.1.1
    types-lxml==2026.2.16
commands =
    mypy {posargs: html_text tests}
